<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>덕배 할아버지와 대화하기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f8ff; padding: 20px; }
        #chat-box { height: 60vh; background: white; border-radius: 15px; padding: 20px; overflow-y: auto; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 1.2em; }
        .user-msg { color: blue; text-align: right; margin-bottom: 10px; }
        .bot-msg { color: #333; text-align: left; margin-bottom: 10px; background-color: #ffebcd; padding: 10px; border-radius: 10px; display: inline-block;}
        input { width: 75%; padding: 15px; font-size: 1.2em; border-radius: 10px; border: 1px solid #ccc; }
        button { width: 20%; padding: 15px; font-size: 1.2em; background-color: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">👴 덕배 할아버지와 대화하기</h1>
    <div id="chat-box"></div>
    <div style="display: flex; justify-content: space-between;">
        <input type="text" id="user-input" placeholder="할아버지에게 할 말을 적어보세요!" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">보내기</button>
    </div>

    <script>
        // ⚠️ 여기에 선생님의 진짜 API 키를 넣으세요!
        const API_KEY = "AQ.Ab8RN6JULjgvJte0vyS6uVUmUd_8xDdH6UdPOCHS8d6f4lHHHg"; 
        const chatBox = document.getElementById('chat-box');

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            chatBox.innerHTML += `<div class="user-msg">👦 나: ${text}</div>`;
            input.value = '';
            chatBox.innerHTML += `<div class="bot-msg" id="loading">👴 할아버지 생각 중...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: "너는 해남 화원면에 30년 넘게 살고 있는 '덕배 할아버지'야. 다리가 불편해 지팡이를 짚고 다녀. 초등학교 3학년과 외국인 학생이 쉽게 이해할 수 있게 아주 쉬운 단어로 2~3문장만 다정하게 말해. 대화 끝에는 마을에 대한 쉬운 질문을 던져줘." }] },
                        contents: [{ parts: [{ text: text }] }]
                    })
                });
                
                const data = await response.json();
                document.getElementById('loading').remove();
                const reply = data.candidates[0].content.parts[0].text;
                chatBox.innerHTML += `<div class="bot-msg">👴 덕배 할아버지: <br>${reply.replace(/\n/g, '<br>')}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="bot-msg" style="color:red;">앗, 통신이 잠시 끊겼나 봐요. 다시 말해볼까요?</div>`;
            }
        }
    </script>
</body>
</html>
