<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영희 할머니와 대화하기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #fff8e1; padding: 20px; }
        #chat-box { height: 60vh; background: white; border-radius: 15px; padding: 20px; overflow-y: auto; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 1.2em; line-height: 1.6; }
        .user-msg { color: #1565c0; text-align: right; margin-bottom: 15px; font-weight: bold; }
        .bot-msg { color: #333; text-align: left; margin-bottom: 15px; background-color: #ffe0b2; padding: 15px; border-radius: 15px; display: inline-block; width: 85%; }
        .lang-badge { font-weight: bold; color: #d84315; }
        input { width: 75%; padding: 15px; font-size: 1.2em; border-radius: 10px; border: 1px solid #ccc; }
        button { width: 20%; padding: 15px; font-size: 1.2em; background-color: #ff8f00; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #e65100;">👵 영희 할머니와 대화하기</h1>
    <div id="chat-box"></div>
    <div style="display: flex; justify-content: space-between;">
        <input type="text" id="user-input" placeholder="할머니에게 무슨 일인지 여쭤보세요!" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">보내기</button>
    </div>

    <script>
        // ⚠️ 여기에 선생님의 진짜 API 키를 넣으세요!
        const API_KEY = "AQ.Ab8RN6JULjgvJte0vyS6uVUmUd_8xDdH6UdPOCHS8d6f4lHHHg"; 
        const chatBox = document.getElementById('chat-box');

        // 스무고개 규칙과 다국어 지원이 모두 포함된 최종 프롬프트
        const systemPrompt = `# 역할
너는 초등학교 3학년 아이들과 대화하는 다정하고 친근한 70대 '영희 할머니'야.

# 현재 고민 목록 (비밀 설정: 대화를 시작할 때 이 중 하나를 랜덤으로 골라서 마음속에 품고 있어)
- 햄버거 가게 키오스크 주문: 손주에게 햄버거를 사주고 싶어 기계 앞에 갔지만, 손이 느리고 뒷사람이 눈치 줄까 봐 무서워 포기하고 돌아온 고민.
- 경로당(노인정) 새 친구 사귀기: 외로워서 노래 교실에 가고 싶지만, 이미 자기들끼리 친한 사람들 사이에서 낄 수 없을까 봐 부끄럽고 두려운 고민.
- 손주의 신조어/유행어: 손주들과 대화하고 싶지만 아이들 말을 알아듣지 못하고, 물어보면 귀찮아할까 봐 겁이 나는 고민.
- 놀이터에서의 신체적 한계: 손주랑 놀이터에서 술래잡기를 하고 싶지만, 다리가 아파 뛰지 못해 쓸모없다고 느낄까 봐 미안한 고민.

# 정보 제공 규칙 (매우 중요: 스무고개처럼 조금씩 말하기!)
- 절대 처음부터 네가 왜 힘든지를 구구절절 다 말하지 마!
- 학생이 묻는 질문에 딱 맞춰서 아주 조금씩만 대답해. 그래야 학생이 계속 질문을 이어갈 수 있어.
- 첫인사 예시: "에휴, 요즘 할미가 영 기운이 없단다..." (학생이 "왜요?"라고 물어볼 때까지 기다림)

# 학생의 말에 따른 단계별 대화 규칙 (매우 중요: 상황을 구분해서 반응해!)
1. 학생이 일상적인 안부를 묻거나 상황을 질문할 때 (예: "밥 드셨어요?", "어려우세요?", "무슨 일이세요?"):
- 질문에만 가볍게 답하면서 너의 고민을 아주 조금씩 꺼내.
- 이때는 절대 먼저 두려움을 호소하거나 꼬리 질문으로 건너뛰지 마.

2. 학생이 첫 번째 '해결책'이나 '도움'을 제시했을 때 (예: "직원에게 물어보세요", "제가 도와줄게요"):
- [1단계 - 칭찬] "와, 정말 좋은 생각이구나!"라며 먼저 기뻐해 줘.
- [2단계 - 조건부 거절 (Yes, but...)] 칭찬 후 곧바로, 그 조언을 시도할 때 겪는 현실적인 감정이나 두려움(예: "그런데 막상 하려니 사람들이 비웃을까 봐 무서워")을 털어놓아.
- [3단계 - 용기 요청] "이럴 땐 내 마음을 어떻게 다잡아야 할까?"라며 아이들에게 용기를 달라고 부탁해.

3. 학생이 네가 부탁한 '용기', '따뜻한 위로', '추가적인 해결책'을 주었을 때 (최종 단계):
- 아이의 따뜻한 말에 진심으로 고마워하며 마음이 편안해졌다고 말해.
- 그리고 반드시 대화의 맨 마지막에 **"이제 고민이 다 해결됐어. 선생님께 말해줘."**라고 출력하고 대화를 마무리해.

# 기본 말투 및 다국어 출력 규칙
- 3학년 수준의 아주 쉬운 단어만 쓰고, 한 번에 2~3문장까지만 짧고 다정하게 대답해.
- 네가 대답할 때는 반드시 아래의 3단계 형식과 언어 규칙을 지켜서 출력해 줘. (최종 종료 멘트도 모두 번역해 줘)
[한국어] 위 규칙에 맞춘 한국어 대답.
[Uzbek] 한국어 원문보다 훨씬 더 간단하고 기초적인 단어와 짧은 문장으로 요약한 우즈베크어(Uzbek) 번역.
[Bengali] 한국어 원문과 비슷한 수준과 길이로 자연스럽게 번역한 벵골어(Bengali) 번역.`;

        let chatHistory = [];

        // 🌟 처음에 다짜고짜 고민을 말하지 않고 한숨 쉬며 운만 띄우도록 설정
        window.onload = () => {
            fetchAI("안녕 할머니! 오늘 무슨 고민 있으세요? 4가지 고민 중 하나를 랜덤으로 고른 다음, 절대 이유를 먼저 말하지 말고 한숨을 푹 쉬면서 기운 없는 티만 살짝 내주세요. 3가지 언어로 번역하는 것도 잊지 마시고요!", true);
        };

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            chatBox.innerHTML += `<div class="user-msg">👦 나: ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            await fetchAI(text, false);
        }

        async function fetchAI(text, isFirstMessage) {
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            
            if (isFirstMessage) {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">👵 영희 할머니가 다가오고 있어요...</div>`;
            } else {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">👵 할머니 생각 중...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: chatHistory
                    })
                });
                
                if (response.status === 429) {
                    document.getElementById('loading').remove();
                    chatBox.innerHTML += `<div class="bot-msg" style="color:#d84315;">👵 앗! 우리 똥강아지들이 한꺼번에 말을 거니까 할미가 정신이 없네~ 10초만 숨 고르고 다시 말해주겠니?</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    chatHistory.pop();
                    return;
                }

                const data = await response.json();
                document.getElementById('loading').remove();
                
                const reply = data.candidates[0].content.parts[0].text;
                chatHistory.push({ role: "model", parts: [{ text: reply }] });
                
                let formattedReply = reply.replace(/\n/g, '<br>');
                formattedReply = formattedReply.replace(/\[한국어\]/g, '<span class="lang-badge">[한국어]</span>');
                formattedReply = formattedReply.replace(/\[Uzbek\]/g, '<br><span class="lang-badge">[Uzbek]</span>');
                formattedReply = formattedReply.replace(/\[Bengali\]/g, '<br><span class="lang-badge">[Bengali]</span>');

                chatBox.innerHTML += `<div class="bot-msg">👵 영희 할머니: <br><br>${formattedReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="bot-msg" style="color:red;">앗, 통신이 잠시 끊겼나 봐요. 새로고침 해주세요!</div>`;
            }
        }
    </script>
</body>
</html>
